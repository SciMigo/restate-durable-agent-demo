# Named actions for agent-runtime (https://github.com/SciMigo/agent-runtime).
# A course page can start these by name after you approve this file, once per commit,
# in the terminal running `agent-runtime serve`. Commands run in this checkout, with the
# lab's own Python environment first on PATH.
schema = 1
id = "restate-durable-agent-demo"
title = "The model call you pay for twice (Restate)"

[actions.setup]
label = "Prepare the lab"
description = "Start the Restate server in Docker (ingress :18080, admin API and UI :19070) and install the demo's Python packages."
steps = [
  ["docker", "compose", "-p", "restate-durable-agent-demo", "up", "-d"],
  ["python", "-m", "pip", "install", "--quiet", "--disable-pip-version-check", "-r", "requirements.txt"],
]
timeout = 600

[actions.stable]
label = "1.1 The extra model call"
description = "Kill the naive agent during its pause and count the model calls."
steps = [["python", "demo.py", "--agent", "naive", "--model", "stable"]]
timeout = 180

[actions.varying]
label = "1.2 When the second answer is different"
steps = [["python", "demo.py", "--agent", "naive", "--model", "varying"]]
timeout = 180

[actions.drifted]
label = "1.3 When it stays different"
description = "Retries pay until the invocation pauses, after about 40 seconds."
steps = [["python", "demo.py", "--agent", "naive", "--model", "drifted", "--wait", "150"]]
timeout = 240

[actions.drifted-slow-restart]
label = "1.3 variation: the agent stays down 9 seconds"
steps = [["python", "demo.py", "--agent", "naive", "--model", "drifted", "--wait", "150", "--restart-delay", "9"]]
timeout = 240

[actions.journaled]
label = "1.4 The fix"
steps = [["python", "demo.py", "--agent", "journaled", "--model", "varying"]]
timeout = 180

[actions.mid-call]
label = "1.5 Kill it mid-call"
steps = [["python", "demo.py", "--agent", "journaled", "--model", "stable", "--kill-during", "model"]]
timeout = 180

[actions.recover]
label = "1.6 Repair a stuck invocation (optional)"
steps = [["python", "recover.py"]]
timeout = 400

[actions.teardown]
label = "Stop the Restate server"
description = "docker compose down: removes the Restate container and its journal."
steps = [["docker", "compose", "-p", "restate-durable-agent-demo", "down"]]
timeout = 120
